services:
  db:
    image: postgres:16-alpine
    container_name: devshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devshelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devshelf}
      POSTGRES_DB: ${POSTGRES_DB:-devshelf}
    ports:
      - "5432:5432"
    volumes:
      - devshelf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devshelf}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devshelf_pgdata:
